<!--
  Vite HTML entry for the Tests (results report) page — builds to
  docs/tests/index.html, same URL as before. This lives here, alongside
  the Vitest spec folders in this same directory, because Vite's
  multi-page build ties each output page's path to its source HTML
  file's own path relative to the project root (see about/index.html
  for the same pattern) — it doesn't clash with anything, since Vitest
  only ever looks for *.test.ts(x) files, never *.html.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/parsnipia-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parsnipia's test suite results." />
    <title>Parsnipia — Test Results</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/TestResults/main.tsx"></script>
  </body>
</html>
